<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090a0f;
      color: #f1f5f9;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
    }
    .badge {
      font-size: 10px;
      background: rgba(99, 102, 241, 0.2);
      color: #818cf8;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .desc {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.4;
      margin-bottom: 14px;
    }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 9px 12px;
      margin-bottom: 8px;
      background: #6366f1;
      color: #ffffff;
      text-align: center;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #4f46e5;
    }
    .btn-secondary {
      background: #1e293b;
      color: #cbd5e1;
    }
    .btn-secondary:hover {
      background: #334155;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">Flow Director</span>
    <span class="badge">Companion</span>
  </div>
  <p class="desc">สตูดิโอดิจิทัลทวิน & AI ผู้กำกับสำหรับ Google Flow</p>
  <a href="http://localhost:5173" target="_blank" class="btn">🚀 เปิด Flow Director Studio</a>
  <a href="https://flow.google" target="_blank" class="btn btn-secondary">🌐 ไปที่ flow.google</a>
</body>
</html>
